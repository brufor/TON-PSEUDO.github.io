    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ==============================
           VIDÉO
           ============================== */

        .video-background {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center center;

            z-index: 0;

            /* Améliore le rendu visuel */
            filter: brightness(0.92) contrast(1.08) saturate(1.08);

            transform: scale(1.01);

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .overlay {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.38)
                );

            z-index: 1;

            pointer-events: none;
        }

        /* ==============================
           PROFIL
           ============================== */

        .profil {
            position: relative;
            z-index: 2;

            width: min(92vw, 440px);

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            animation: apparition 0.9s ease;
        }

        /* ==============================
           PHOTO
           ============================== */

        .photo-container {
            position: relative;

            width: 150px;
            height: 150px;

            margin-bottom: 22px;
        }

        .photo-container::before {
            content: "";

            position: absolute;
            inset: -22px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.32),
                    rgba(255,255,255,0)
                );

            filter: blur(18px);

            animation: halo 3s ease-in-out infinite;
        }

        .photo-profil {
            position: relative;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            border: 3px solid rgba(255,255,255,0.95);

            box-shadow:
                0 0 20px rgba(0,0,0,0.9),
                0 0 45px rgba(255,255,255,0.18);

            image-rendering: auto;
        }

        /* ==============================
           NOM
           ============================== */

        h1 {
            margin: 0;

            font-size: 46px;

            font-weight: 700;

            letter-spacing: 3px;

            text-shadow:
                0 0 14px rgba(255,255,255,0.25),
                0 5px 25px rgba(0,0,0,1);
        }

        /* ==============================
           STATUT
           ============================== */

        .activite {
            margin-top: 14px;

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 15px;

            font-weight: 700;

            transition:
                color 0.35s ease,
                transform 0.35s ease;
        }

        .point {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #777;

            transition:
                background 0.35s ease,
                box-shadow 0.35s ease;

            animation: pulse 1.7s ease-in-out infinite;
        }

        /* ==============================
           CARTE DISCORD
           ============================== */

        .jeu-card {
            width: 100%;

            margin-top: 18px;

            padding: 14px;

            display: none;

            align-items: center;

            gap: 13px;

            text-align: left;

            border-radius: 17px;

            background:
                rgba(12, 12, 12, 0.58);

            border:
                1px solid rgba(255,255,255,0.14);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.38),
                inset 0 1px 0 rgba(255,255,255,0.07);

            opacity: 0;

            transform:
                translateY(10px)
                scale(0.98);

            transition:
                opacity 0.35s ease,
                transform 0.35s ease;
        }

        .jeu-card.visible {
            display: flex;

            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }

        .jeu-card.changement {
            animation: changement 0.5s ease;
        }

        /* ==============================
           ICÔNE
           ============================== */

        .jeu-icone {
            width: 58px;
            height: 58px;

            flex-shrink: 0;

            border-radius: 13px;

            object-fit: cover;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(255,255,255,0.12);

            box-shadow:
                0 5px 18px rgba(0,0,0,0.25);

            overflow: hidden;
        }

        .jeu-icone.placeholder {
            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 26px;
        }

        /* ==============================
           TEXTE ACTIVITÉ
           ============================== */

        .jeu-infos {
            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 4px;
        }

        .jeu-label {
            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1.4px;

            color:
                rgba(255,255,255,0.45);

            font-weight: 700;
        }

        .jeu-nom {
            font-size: 16px;

            font-weight: 700;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .jeu-details {
            font-size: 13px;

            color:
                rgba(255,255,255,0.72);

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .jeu-timing {
            font-size: 12px;

            color:
                rgba(255,255,255,0.43);

            margin-top: 1px;
        }

        /* ==============================
           BOUTON SON
           ============================== */

        .sound-button {
            position: fixed;

            right: 25px;
            bottom: 25px;

            width: 58px;
            height: 58px;

            border:
                1px solid rgba(255,255,255,0.20);

            border-radius: 50%;

            background:
                rgba(15,15,15,0.55);

            color: white;

            font-size: 23px;

            cursor: pointer;

            z-index: 10;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .sound-button:hover {
            transform: scale(1.08);

            background:
                rgba(30,30,30,0.75);
        }

        .sound-button:active {
            transform: scale(0.94);
        }

        /* ==============================
           ANIMATIONS
           ============================== */

        @keyframes apparition {
            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.96);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes changement {
            0% {
                opacity: 0.4;

                transform:
                    translateY(8px)
                    scale(0.98);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes halo {
            0%,
            100% {
                transform: scale(0.92);

                opacity: 0.45;
            }

            50% {
                transform: scale(1.08);

                opacity: 0.85;
            }
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);

                opacity: 1;
            }

            50% {
                transform: scale(1.35);

                opacity: 0.65;
            }
        }

        /* ==============================
           MOBILE
           ============================== */

        @media (max-width: 600px) {

            .profil {
                width: 88vw;
            }

            .photo-container,
            .photo-profil {
                width: 115px;
                height: 115px;
            }

            h1 {
                font-size: 33px;
            }

            .activite {
                font-size: 14px;
            }

            .jeu-card {
                padding: 12px;
            }

            .jeu-icone {
                width: 48px;
                height: 48px;
            }

            .jeu-nom {
                font-size: 14px;
            }

            .jeu-details {
                font-size: 12px;
            }

            .sound-button {
                width: 52px;
                height: 52px;

                right: 18px;
                bottom: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- ==============================
         VIDÉO DE FOND
         ============================== -->

    <video
        class="video-background"
        autoplay
        muted
        loop
        playsinline
        preload="auto">

        <source src="clip.mp4" type="video/mp4">

    </video>

    <div class="overlay"></div>


    <!-- ==============================
         PROFIL
         ============================== -->

    <main class="profil">

        <div class="photo-container">

            <img
                class="photo-profil"
                src="profil.png"
                alt="Photo de profil">

        </div>


        <h1>¹²³⁴⁵</h1>


        <!-- STATUT -->

        <div class="activite">

            <span
                class="point"
                id="point">
            </span>

            <span id="statut">
                CHARGEMENT...
            </span>

        </div>


        <!-- ACTIVITÉ -->

        <div
            class="jeu-card"
            id="jeuCard">

            <div
                class="jeu-icone placeholder"
                id="jeuIcone">

                🎮

            </div>

            <div class="jeu-infos">

                <div class="jeu-label">
                    ACTIVITÉ DISCORD
                </div>

                <div
                    class="jeu-nom"
                    id="jeuNom">
                </div>

                <div
                    class="jeu-details"
                    id="jeuDetails">
                </div>

                <div
                    class="jeu-timing"
                    id="jeuTiming">
                </div>

            </div>

        </div>

    </main>


    <!-- ==============================
         SON
         ============================== -->

    <button
        class="sound-button"
        onclick="toggleSound()"
        aria-label="Activer ou couper le son">

        🔇

    </button>


    <script>

        /* =====================================================
           🔴🔴🔴 TON ID DISCORD 🔴🔴🔴

           GARDE LES GUILLEMETS.

           REMPLACE UNIQUEMENT TON_ID_DISCORD.

           Exemple :

           const DISCORD_ID = "123456789012345678";

           ===================================================== */

        const DISCORD_ID = "1303798212540239923";


        /* =====================================================
           COULEURS
           ===================================================== */

        const couleurs = {

            online: "#00ff88",

            idle: "#ffaa00",

            dnd: "#ff4444",

            offline: "#777777"

        };


        /* =====================================================
           NOMS
           ===================================================== */

        const nomsStatut = {

            online: "EN LIGNE",

            idle: "ABSENT",

            dnd: "NE PAS DÉRANGER",

            offline: "HORS LIGNE"

        };


        /* =====================================================
           VARIABLES
           ===================================================== */

        let activiteActuelle = "";

        let debutActivite = null;


        /* =====================================================
           CHARGER DISCORD
           ===================================================== */

        async function chargerDiscord() {

            try {

                const response = await fetch(
                    `https://api.lanyard.rest/v1/users/${DISCORD_ID}`
                );


                const result =
                    await response.json();


                if (!result.success) {

                    throw new Error(
                        "Impossible de récupérer Discord"
                    );

                }


                const data =
                    result.data;


                /* ==============================
                   STATUT
                   ============================== */

                const statut =
                    data.discord_status;


                const statutElement =
                    document.getElementById(
                        "statut"
                    );


                const point =
                    document.getElementById(
                        "point"
                    );


                const couleur =
                    couleurs[statut] ||
                    couleurs.offline;


                statutElement.textContent =
                    nomsStatut[statut] ||
                    "HORS LIGNE";


                statutElement.style.color =
                    couleur;


                point.style.background =
                    couleur;


                point.style.boxShadow =
                    `0 0 8px ${couleur},
                     0 0 18px ${couleur}`;


                /* ==============================
                   ACTIVITÉS
                   ============================== */

                const activites =
                    data.activities || [];


                const activite =
                    activites.find(
                        activity =>
                            activity.type === 0
                    );


                const carte =
                    document.getElementById(
                        "jeuCard"
                    );


                const nom =
                    document.getElementById(
                        "jeuNom"
                    );


                const details =
                    document.getElementById(
                        "jeuDetails"
                    );


                const timing =
                    document.getElementById(
                        "jeuTiming"
                    );


                const icone =
                    document.getElementById(
                        "jeuIcone"
                    );


                /* ==============================
                   AUCUNE ACTIVITÉ
                   ============================== */

                if (!activite) {

                    carte.classList.remove(
                        "visible"
                    );

                    activiteActuelle = "";

                    debutActivite = null;

                    return;

                }


                /* ==============================
                   DÉTECTER UN CHANGEMENT
                   ============================== */

                const nouvelleActivite =
                    `${activite.name || ""}
                     ${activite.details || ""}
                     ${activite.state || ""}`;


                if (
                    nouvelleActivite !==
                    activiteActuelle
                ) {

                    activiteActuelle =
                        nouvelleActivite;

                    carte.classList.remove(
                        "changement"
                    );


                    void carte.offsetWidth;


                    carte.classList.add(
                        "changement"
                    );

                }


                /* ==============================
                   NOM
                   ============================== */

                nom.textContent =
                    activite.name ||
                    "Activité";


                /* ==============================
                   DÉTAILS
                   ============================== */

                if (activite.details) {

                    details.textContent =
                        activite.details;

                } else if (activite.state) {

                    details.textContent =
                        activite.state;

                } else {

                    details.textContent =
                        "En cours";

                }


                /* ==============================
                   TEMPS
                   ============================== */

                if (
                    activite.timestamps &&
                    activite.timestamps.start
                ) {

                    debutActivite =
                        activite.timestamps.start;

                    afficherTemps(
                        debutActivite
                    );

                } else {

                    timing.textContent =
                        "";

                }


                /* ==============================
                   ICÔNE DISCORD
                   ============================== */

                if (
                    activite.assets &&
                    activite.assets.large_image
                ) {

                    let image =
                        activite.assets.large_image;


                    if (
                        image.startsWith("mp:")
                    ) {

                        image =
                            image.substring(3);

                    }


                    if (
                        image.startsWith("https://") ||
                        image.startsWith("http://")
                    ) {

                        icone.classList.remove(
                            "placeholder"
                        );

                        icone.innerHTML =
                            "";

                        icone.style.backgroundImage =
                            `url("${image}")`;

                        icone.style.backgroundSize =
                            "cover";

                        icone.style.backgroundPosition =
                            "center";

                    } else {

                        icone.classList.add(
                            "placeholder"
                        );

                        icone.style.backgroundImage =
                            "";

                        icone.innerHTML =
                            "🎮";

                    }

                } else {

                    icone.classList.add(
                        "placeholder"
                    );

                    icone.style.backgroundImage =
                        "";

                    icone.innerHTML =
                        "🎮";

                }


                /* ==============================
                   AFFICHER LA CARTE
                   ============================== */

                carte.classList.add(
                    "visible"
                );

            } catch (error) {

                console.error(error);


                document.getElementById(
                    "statut"
                ).textContent =
                    "HORS LIGNE";


                document.getElementById(
                    "statut"
                ).style.color =
                    couleurs.offline;


                document.getElementById(
                    "point"
                ).style.background =
                    couleurs.offline;


                document.getElementById(
                    "jeuCard"
                ).classList.remove(
                    "visible"
                );

            }

        }


        /* =====================================================
           COMPTEUR
           ===================================================== */

        function afficherTemps(debut) {

            const timing =
                document.getElementById(
                    "jeuTiming"
                );


            const maintenant =
                Date.now();


            const secondesTotales =
                Math.max(
                    0,
                    Math.floor(
                        (maintenant - debut) / 1000
                    )
                );


            const heures =
                Math.floor(
                    secondesTotales / 3600
                );


            const minutes =
                Math.floor(
                    (secondesTotales % 3600) / 60
                );


            const secondes =
                secondesTotales % 60;


            if (heures > 0) {

                timing.textContent =
                    `Depuis ${heures}h ${minutes
                        .toString()
                        .padStart(2, "0")}min`;

            } else {

                timing.textContent =
                    `Depuis ${minutes
                        .toString()
                        .padStart(2, "0")}min ${secondes
                        .toString()
                        .padStart(2, "0")}s`;

            }

        }


        /* =====================================================
           MISE À JOUR DU COMPTEUR
           ===================================================== */

        setInterval(() => {

            if (debutActivite) {

                afficherTemps(
                    debutActivite
                );

            }

        }, 1000);


        /* =====================================================
           PREMIÈRE CHARGE
           ===================================================== */

        chargerDiscord();


        /* =====================================================
           ACTUALISATION DISCORD
           ===================================================== */

        setInterval(
            chargerDiscord,
            10000
        );


        /* =====================================================
           BOUTON SON
           ===================================================== */

        function toggleSound() {

            const video =
                document.querySelector(
                    ".video-background"
                );


            const button =
                document.querySelector(
                    ".sound-button"
                );


            video.muted =
                !video.muted;


            button.textContent =
                video.muted
                    ? "🔇"
                    : "🔊";

        }

    </script>

</body>
</html>
