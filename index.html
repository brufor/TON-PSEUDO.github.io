```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>brufor</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: black;
    cursor: none;
}

/* VIDEO */

#background-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -5;

    filter:
        brightness(0.92)
        contrast(1.08)
        saturate(1.08);

    transform: scale(1.01);
}

/* DARK OVERLAY */

.overlay {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(0,0,0,0.08),
            rgba(0,0,0,0.55)
        );

    z-index: -4;
}

/* PARTICLES */

#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

/* PROFILE */

.profile {
    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: min(420px, 90vw);

    padding: 35px 25px;

    text-align: center;

    color: white;

    background: rgba(0, 0, 0, 0.30);

    border: 1px solid rgba(255,255,255,0.12);

    border-radius: 24px;

    backdrop-filter: blur(12px);

    box-shadow:
        0 0 40px rgba(0,0,0,0.35),
        inset 0 0 30px rgba(255,255,255,0.02);

    z-index: 5;

    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translate(-50%, -47%) scale(0.95);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

/* PROFILE IMAGE */

.photo-profil {
    width: 115px;
    height: 115px;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid rgba(255,255,255,0.85);

    box-shadow:
        0 0 20px rgba(255,255,255,0.25),
        0 0 50px rgba(255,255,255,0.08);

    transition: 0.35s ease;
}

.photo-profil:hover {
    transform:
        scale(1.08)
        rotate(2deg);

    box-shadow:
        0 0 30px rgba(255,255,255,0.5),
        0 0 80px rgba(255,255,255,0.15);
}

/* NAME */

h1 {
    margin-top: 18px;

    font-size: 30px;

    letter-spacing: 2px;

    transition: 0.25s ease;

    text-shadow:
        0 0 10px rgba(255,255,255,0.15);
}

h1:hover {
    letter-spacing: 4px;
}

/* STATUS */

.status {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 8px;

    margin-top: 10px;

    font-size: 13px;

    color: rgba(255,255,255,0.75);
}

.status-dot {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #777;

    box-shadow: 0 0 10px currentColor;

    transition: 0.3s ease;
}

/* ACTIVITY */

.activity {
    margin-top: 20px;

    padding: 14px;

    border-radius: 15px;

    background: rgba(255,255,255,0.06);

    border: 1px solid rgba(255,255,255,0.08);

    text-align: left;

    display: none;
}

.activity-title {
    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;

    opacity: 0.55;

    margin-bottom: 5px;
}

.activity-name {
    font-size: 15px;

    font-weight: bold;
}

.activity-time {
    margin-top: 4px;

    font-size: 12px;

    opacity: 0.6;
}

/* BADGES */

.badges {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 20px;
}

.badge {
    padding: 6px 10px;

    border-radius: 10px;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.08);

    font-size: 11px;

    transition: 0.2s ease;
}

.badge:hover {
    background: rgba(255,255,255,0.15);

    transform: translateY(-2px);
}

/* SOUND BUTTON */

.sound-button {
    position: fixed;

    top: 20px;
    right: 20px;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: rgba(0,0,0,0.4);

    border: 1px solid rgba(255,255,255,0.15);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;

    cursor: none;

    backdrop-filter: blur(10px);

    z-index: 20;

    transition: 0.25s ease;
}

.sound-button:hover {
    transform: scale(1.1);

    background: rgba(255,255,255,0.12);
}

/* COMPTEUR DE VUES */

#views {
    position: fixed;

    left: 20px;
    bottom: 20px;

    padding: 8px 14px;

    border-radius: 12px;

    background: rgba(0,0,0,0.45);

    backdrop-filter: blur(10px);

    color: white;

    font-size: 13px;

    font-weight: 600;

    border: 1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 0 15px rgba(0,0,0,0.25);

    z-index: 9999;

    pointer-events: none;
}

/* SWORD CURSOR */

#sword-cursor {
    position: fixed;

    width: 30px;
    height: 30px;

    pointer-events: none;

    z-index: 99999;

    transform:
        translate(-3px, -3px)
        rotate(-35deg);
}

#sword-cursor::before {
    content: "";

    position: absolute;

    width: 4px;
    height: 25px;

    background: linear-gradient(
        to bottom,
        white,
        #aaa
    );

    left: 13px;
    top: 0;

    border-radius: 4px;

    box-shadow:
        0 0 8px rgba(255,255,255,0.7);
}

#sword-cursor::after {
    content: "";

    position: absolute;

    width: 18px;
    height: 4px;

    background: #c9a227;

    left: 6px;
    top: 22px;

    border-radius: 5px;

    box-shadow:
        0 0 6px rgba(201,162,39,0.6);
}

/* TRAIL */

.trail {
    position: fixed;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: rgba(255,255,255,0.7);

    pointer-events: none;

    z-index: 9998;

    animation: trailFade 0.5s linear forwards;
}

@keyframes trailFade {
    from {
        opacity: 0.8;
        transform: scale(1);
    }

    to {
        opacity: 0;
        transform: scale(0);
    }
}

/* CLICK EXPLOSION */

.click-particle {
    position: fixed;

    width: 6px;
    height: 6px;

    background: white;

    border-radius: 50%;

    pointer-events: none;

    z-index: 9997;

    animation: explode 0.6s ease-out forwards;
}

@keyframes explode {
    to {
        opacity: 0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);
    }
}

/* MOBILE */

@media (max-width: 600px) {

    .profile {
        width: 88vw;

        padding: 28px 18px;
    }

    .photo-profil {
        width: 95px;
        height: 95px;
    }

    h1 {
        font-size: 25px;
    }

    #views {
        left: 12px;
        bottom: 12px;
    }
}
</style>
</head>

<body>

<!-- VIDEO -->

<video
    id="background-video"
    autoplay
    muted
    loop
    playsinline
>
    <source src="clip.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<canvas id="particles"></canvas>

<!-- CURSEUR -->

<div id="sword-cursor"></div>

<!-- SON -->

<button class="sound-button" id="soundButton">
    🔇
</button>

<!-- PROFIL -->

<div class="profile">

    <img
        src="profil.png"
        alt="Photo de profil"
        class="photo-profil"
    >

    <h1>brufor</h1>

    <div class="status">

        <span
            class="status-dot"
            id="statusDot"
        ></span>

        <span id="statusText">
            Chargement...
        </span>

    </div>

    <div
        class="activity"
        id="activity"
    >

        <div class="activity-title">
            Activité Discord
        </div>

        <div
            class="activity-name"
            id="activityName"
        >
        </div>

        <div
            class="activity-time"
            id="activityTime"
        >
        </div>

    </div>

    <div
        class="badges"
        id="badges"
    >

        <div class="badge">
            ✨ Profile
        </div>

        <div class="badge">
            🎮 Gamer
        </div>

        <div class="badge">
            💻 Developer
        </div>

    </div>

</div>

<!-- COMPTEUR DE VUES -->

<div id="views">
    👁 0 vues
</div>

<script>

/* =========================
   DISCORD LANYARD
========================= */

const DISCORD_ID = "TON_ID_DISCORD";

const couleurs = {
    online: "#00ff88",
    idle: "#ffaa00",
    dnd: "#ff4444",
    offline: "#777777"
};

const nomsStatut = {
    online: "EN LIGNE",
    idle: "ABSENT",
    dnd: "NE PAS DÉRANGER",
    offline: "HORS LIGNE"
};

let activityStart = null;

async function updateDiscord() {

    try {

        const response = await fetch(
            `https://api.lanyard.rest/v1/users/${DISCORD_ID}`
        );

        const result = await response.json();

        if (!result.success) {
            return;
        }

        const data = result.data;

        const status =
            data.discord_status || "offline";

        const statusDot =
            document.getElementById("statusDot");

        const statusText =
            document.getElementById("statusText");

        statusDot.style.background =
            couleurs[status];

        statusDot.style.color =
            couleurs[status];

        statusText.textContent =
            nomsStatut[status];

        /* ACTIVITY */

        const activityBox =
            document.getElementById("activity");

        const activityName =
            document.getElementById("activityName");

        const activityTime =
            document.getElementById("activityTime");

        const activity =
            data.activities?.find(
                a => a.type === 0
            );

        if (activity) {

            activityBox.style.display =
                "block";

            activityName.textContent =
                activity.name;

            if (
                activity.timestamps &&
                activity.timestamps.start
            ) {

                activityStart =
                    activity.timestamps.start;

                updateActivityTime();

            } else {

                activityTime.textContent =
                    "";
            }

        } else {

            activityBox.style.display =
                "none";

            activityStart = null;
        }

    } catch (error) {

        console.log(
            "Erreur Discord:",
            error
        );

    }

}

/* TEMPS ACTIVITÉ */

function updateActivityTime() {

    if (!activityStart) {
        return;
    }

    const now =
        Date.now();

    const diff =
        now - activityStart;

    if (diff < 0) {
        return;
    }

    const seconds =
        Math.floor(diff / 1000);

    const minutes =
        Math.floor(seconds / 60);

    const hours =
        Math.floor(minutes / 60);

    let text;

    if (hours > 0) {

        text =
            `Depuis ${hours}h ${minutes % 60}min`;

    } else {

        text =
            `Depuis ${minutes}min`;
    }

    document.getElementById(
        "activityTime"
    ).textContent = text;
}

updateDiscord();

setInterval(
    updateDiscord,
    10000
);

setInterval(
    updateActivityTime,
    30000
);


/* =========================
   SON
========================= */

const video =
    document.getElementById(
        "background-video"
    );

const soundButton =
    document.getElementById(
        "soundButton"
    );

soundButton.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        soundButton.textContent =
            video.muted
                ? "🔇"
                : "🔊";
    }
);


/* =========================
   PARTICULES
========================= */

const canvas =
    document.getElementById(
        "particles"
    );

const ctx =
    canvas.getContext("2d");

let particles = [];

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

for (
    let i = 0;
    i < 70;
    i++
) {

    particles.push({

        x:
            Math.random()
            * window.innerWidth,

        y:
            Math.random()
            * window.innerHeight,

        size:
            Math.random() * 2 + 0.5,

        speed:
            Math.random() * 0.5 + 0.1,

        opacity:
            Math.random() * 0.5 + 0.1
    });
}

function drawParticles() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(
        particle => {

            particle.y -=
                particle.speed;

            if (
                particle.y < 0
            ) {

                particle.y =
                    canvas.height;
            }

            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                `rgba(255,255,255,${particle.opacity})`;

            ctx.fill();
        }
    );

    requestAnimationFrame(
        drawParticles
    );
}

drawParticles();


/* =========================
   CURSEUR
========================= */

const sword =
    document.getElementById(
        "sword-cursor"
    );

document.addEventListener(
    "mousemove",
    event => {

        sword.style.left =
            event.clientX + "px";

        sword.style.top =
            event.clientY + "px";

        const trail =
            document.createElement(
                "div"
            );

        trail.className =
            "trail";

        trail.style.left =
            event.clientX + "px";

        trail.style.top =
            event.clientY + "px";

        document.body.appendChild(
            trail
        );

        setTimeout(
            () => trail.remove(),
            500
        );
    }
);


/* =========================
   CLICK EFFECT
========================= */

document.addEventListener(
    "click",
    event => {

        for (
            let i = 0;
            i < 10;
            i++
        ) {

            const particle =
                document.createElement(
                    "div"
                );

            particle.className =
                "click-particle";

            particle.style.left =
                event.clientX + "px";

            particle.style.top =
                event.clientY + "px";

            const angle =
                Math.random()
                * Math.PI
                * 2;

            const distance =
                Math.random()
                * 70 + 20;

            particle.style.setProperty(
                "--x",
                `${Math.cos(angle) * distance}px`
            );

            particle.style.setProperty(
                "--y",
                `${Math.sin(angle) * distance}px`
            );

            document.body.appendChild(
                particle
            );

            setTimeout(
                () => particle.remove(),
                600
            );
        }
    }
);


/* =========================
   COMPTEUR DE VUES
========================= */

let vues =
    parseInt(
        localStorage.getItem(
            "brufor_profile_views"
        )
    );

if (isNaN(vues)) {

    vues = 0;
}

vues++;

localStorage.setItem(
    "brufor_profile_views",
    vues
);

document.getElementById(
    "views"
).textContent =
    "👁 " + vues + " vues";

</script>

</body>
</html>
