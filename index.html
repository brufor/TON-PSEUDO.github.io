<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¹²³⁴⁵</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
            pointer-events: none;
        }

        .profil {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: apparition 1s ease;
        }

        .photo-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 22px;
        }

        .photo-container::before {
            content: "";
            position: absolute;
            inset: -18px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            filter: blur(22px);
            animation: halo 3s ease-in-out infinite;
        }

        .photo-profil {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 3px solid white;
            box-shadow:
                0 0 25px rgba(0, 0, 0, 0.9),
                0 0 45px rgba(255, 255, 255, 0.12);
        }

        h1 {
            margin: 0;
            font-size: 46px;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow:
                0 0 12px rgba(255, 255, 255, 0.25),
                0 4px 18px rgba(0, 0, 0, 0.95);
        }

        .activite {
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 16px;
            font-weight: 600;
            color: #00ff88;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }

        .point {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow:
                0 0 8px #00ff88,
                0 0 18px rgba(0, 255, 136, 0.65);
            animation: pulse 1.7s ease-in-out infinite;
        }

        .jeu {
            margin-top: 10px;
            font-size: 15px;
            font-weight: 500;
            color: white;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
            max-width: 90vw;
        }

        .sound-button {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 58px;
            height: 58px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 50%;
            background: rgba(15, 15, 15, 0.55);
            color: white;
            font-size: 23px;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(12px);
        }

        @keyframes apparition {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes halo {
            0%, 100% {
                transform: scale(0.92);
                opacity: 0.45;
            }

            50% {
                transform: scale(1.08);
                opacity: 0.85;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.35);
                opacity: 0.65;
            }
        }

        @media (max-width: 600px) {
            .photo-container,
            .photo-profil {
                width: 115px;
                height: 115px;
            }

            h1 {
                font-size: 33px;
            }

            .activite {
                font-size: 14px;
            }

            .jeu {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- VIDEO DE FOND -->
    <video
        class="video-background"
        autoplay
        muted
        loop
        playsinline
        preload="auto">

        <source src="clip.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <!-- PROFIL -->
    <main class="profil">

        <div class="photo-container">
            <img
                class="photo-profil"
                src="profil.png"
                alt="Photo de profil">
        </div>

        <h1>¹²³⁴⁵</h1>

        <!-- STATUT DISCORD -->
        <div class="activite">
            <span class="point" id="point"></span>
            <span id="statut">CHARGEMENT...</span>
        </div>

        <!-- ACTIVITÉ / JEU -->
        <div class="jeu" id="jeu"></div>

    </main>

    <!-- BOUTON SON -->
    <button
        class="sound-button"
        onclick="toggleSound()"
        aria-label="Activer ou couper le son">
        🔇
    </button>


    <script>

        /* ==================================================
           🔴🔴🔴 TON ID DISCORD EST ICI 🔴🔴🔴

           REMPLACE SEULEMENT :

           TON_ID_DISCORD

           PAR TON ID DISCORD.

           EXEMPLE :

           const DISCORD_ID = "123456789012345678";

           ================================================== */

        const DISCORD_ID = "TON_ID_DISCORD"; // 👈 METS TON ID ICI


        /* ==================================================
           COULEURS DES STATUTS
           ================================================== */

        const couleurs = {
            online: "#00ff88",
            idle: "#ffaa00",
            dnd: "#ff4444",
            offline: "#777777"
        };


        /* ==================================================
           NOMS DES STATUTS
           ================================================== */

        const nomsStatut = {
            online: "EN LIGNE",
            idle: "ABSENT",
            dnd: "NE PAS DÉRANGER",
            offline: "HORS LIGNE"
        };


        /* ==================================================
           RÉCUPÉRATION DU STATUT DISCORD
           ================================================== */

        async function chargerDiscord() {

            try {

                const response = await fetch(
                    `https://api.lanyard.rest/v1/users/${DISCORD_ID}`
                );

                const result = await response.json();

                if (!result.success) {
                    throw new Error("Impossible de récupérer Discord");
                }

                const data = result.data;

                const statut = data.discord_status;


                /* AFFICHER LE STATUT */

                document.getElementById("statut").textContent =
                    nomsStatut[statut] || "HORS LIGNE";


                /* CHANGER LA COULEUR */

                const couleur =
                    couleurs[statut] || couleurs.offline;

                document.getElementById("statut").style.color =
                    couleur;

                document.getElementById("point").style.background =
                    couleur;

                document.getElementById("point").style.boxShadow =
                    `0 0 8px ${couleur}, 0 0 18px ${couleur}`;


                /* CHERCHER UNE ACTIVITÉ */

                const activites = data.activities || [];

                const activite = activites.find(
                    activity => activity.type === 0
                );


                /* AFFICHER LE JEU */

                const jeu = document.getElementById("jeu");

                if (activite) {

                    if (activite.details) {

                        jeu.textContent =
                            `🎮 ${activite.name} — ${activite.details}`;

                    } else {

                        jeu.textContent =
                            `🎮 ${activite.name}`;

                    }

                } else {

                    jeu.textContent = "";

                }

            } catch (error) {

                console.error(error);

                document.getElementById("statut").textContent =
                    "HORS LIGNE";

                document.getElementById("statut").style.color =
                    couleurs.offline;

                document.getElementById("point").style.background =
                    couleurs.offline;

                document.getElementById("jeu").textContent = "";

            }

        }


        /* ==================================================
           ACTUALISATION DU STATUT
           ================================================== */

        chargerDiscord();

        setInterval(chargerDiscord, 10000);


        /* ==================================================
           BOUTON SON
           ================================================== */

        function toggleSound() {

            const video =
                document.querySelector(".video-background");

            const button =
                document.querySelector(".sound-button");

            video.muted = !video.muted;

            button.textContent =
                video.muted ? "🔇" : "🔊";
        }

    </script>

</body>
</html>
