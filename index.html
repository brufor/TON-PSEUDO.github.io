<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12345</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    cursor: none;
}

/* =========================
   VIDEO DE FOND
========================= */

#background-video {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    object-fit: cover;

    background: #000;

    z-index: 0;
}

/* voile sombre */

.video-overlay {
    position: fixed;
    inset: 0;

    background:
        rgba(0, 0, 0, 0.35);

    z-index: 1;

    pointer-events: none;
}

/* =========================
   PARTICULES
========================= */

#particles {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 2;
}

/* =========================
   PROFIL
========================= */

.profile {
    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    width: min(420px, 90vw);

    padding: 35px 25px;

    text-align: center;

    color: white;

    background:
        rgba(0, 0, 0, 0.32);

    border:
        1px solid rgba(255,255,255,0.13);

    border-radius: 24px;

    backdrop-filter: blur(12px);

    box-shadow:
        0 0 45px rgba(0,0,0,0.45);

    z-index: 10;

    animation: apparition 1s ease;
}

@keyframes apparition {

    from {
        opacity: 0;

        transform:
            translate(-50%, -47%)
            scale(0.94);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

/* =========================
   PHOTO
========================= */

.photo-profil {
    width: 115px;
    height: 115px;

    object-fit: cover;

    border-radius: 50%;

    border:
        3px solid rgba(255,255,255,0.9);

    box-shadow:
        0 0 25px rgba(255,255,255,0.25);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.photo-profil:hover {
    transform:
        scale(1.08)
        rotate(2deg);

    box-shadow:
        0 0 45px rgba(255,255,255,0.5);
}

/* =========================
   PSEUDO
========================= */

h1 {
    margin-top: 18px;

    font-size: 30px;

    letter-spacing: 2px;

    text-shadow:
        0 0 15px rgba(255,255,255,0.15);

    transition:
        letter-spacing 0.25s ease;
}

h1:hover {
    letter-spacing: 4px;
}

/* =========================
   STATUS
========================= */

.status {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 8px;

    margin-top: 10px;

    color:
        rgba(255,255,255,0.8);

    font-size: 13px;
}

.status-dot {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #777;

    box-shadow:
        0 0 10px currentColor;
}

/* =========================
   ACTIVITÉ
========================= */

.activity {
    display: none;

    margin-top: 20px;

    padding: 14px;

    border-radius: 15px;

    text-align: left;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.09);
}

.activity-title {
    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1px;

    opacity: 0.5;

    margin-bottom: 5px;
}

.activity-name {
    font-size: 15px;

    font-weight: bold;
}

.activity-time {
    margin-top: 4px;

    font-size: 12px;

    opacity: 0.6;
}

/* =========================
   BADGES
========================= */

.badges {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 20px;
}

.badge {
    padding: 6px 10px;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid rgba(255,255,255,0.08);

    font-size: 11px;

    transition: 0.2s ease;
}

.badge:hover {
    transform:
        translateY(-2px);

    background:
        rgba(255,255,255,0.15);
}

/* =========================
   BOUTON SON
========================= */

.sound-button {
    position: fixed;

    top: 20px;
    right: 20px;

    width: 42px;
    height: 42px;

    border: 1px solid
        rgba(255,255,255,0.15);

    border-radius: 50%;

    background:
        rgba(0,0,0,0.45);

    color: white;

    font-size: 18px;

    z-index: 20;

    cursor: none;

    backdrop-filter: blur(10px);

    transition:
        transform 0.2s ease;
}

.sound-button:hover {
    transform: scale(1.1);
}

/* =========================
   COMPTEUR
========================= */

#views {
    position: fixed;

    left: 20px;
    bottom: 20px;

    padding: 8px 14px;

    border-radius: 12px;

    background:
        rgba(0,0,0,0.5);

    border:
        1px solid rgba(255,255,255,0.12);

    color: white;

    font-size: 13px;

    font-weight: 600;

    backdrop-filter: blur(10px);

    box-shadow:
        0 0 15px rgba(0,0,0,0.25);

    z-index: 100;

    pointer-events: none;
}

/* =========================
   CURSEUR ÉPÉE
========================= */

#sword-cursor {
    position: fixed;

    width: 30px;
    height: 30px;

    pointer-events: none;

    z-index: 9999;

    transform:
        translate(-3px,-3px)
        rotate(-35deg);
}

#sword-cursor::before {
    content: "";

    position: absolute;

    width: 4px;
    height: 25px;

    left: 13px;
    top: 0;

    border-radius: 4px;

    background:
        linear-gradient(
            to bottom,
            white,
            #999
        );

    box-shadow:
        0 0 8px white;
}

#sword-cursor::after {
    content: "";

    position: absolute;

    width: 18px;
    height: 4px;

    left: 6px;
    top: 22px;

    border-radius: 5px;

    background: #c9a227;
}

/* =========================
   TRAÎNÉE
========================= */

.trail {
    position: fixed;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    pointer-events: none;

    z-index: 9998;

    animation:
        trail 0.5s linear forwards;
}

@keyframes trail {

    from {
        opacity: 0.8;
        transform: scale(1);
    }

    to {
        opacity: 0;
        transform: scale(0);
    }
}

/* =========================
   EXPLOSION CLIC
========================= */

.click-particle {
    position: fixed;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: white;

    pointer-events: none;

    z-index: 9997;

    animation:
        explosion 0.6s ease-out forwards;
}

@keyframes explosion {

    to {
        opacity: 0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .profile {
        width: 88vw;

        padding:
            28px 18px;
    }

    .photo-profil {
        width: 95px;
        height: 95px;
    }

    h1 {
        font-size: 25px;
    }

    #views {
        left: 12px;
        bottom: 12px;
    }
}
</style>
</head>

<body>

<!-- =========================
     VIDEO
========================= -->

<video
    id="background-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
>
    <source src="./clip.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<canvas id="particles"></canvas>

<!-- CURSEUR -->

<div id="sword-cursor"></div>

<!-- SON -->

<button
    class="sound-button"
    id="soundButton"
>
    🔇
</button>

<!-- PROFIL -->

<div class="profile">

    <img
        src="./profil.png"
        alt="Photo de profil"
        class="photo-profil"
    >

    <h1>12345</h1>

    <div class="status">

        <span
            class="status-dot"
            id="statusDot"
        ></span>

        <span id="statusText">
            Chargement...
        </span>

    </div>

    <div
        class="activity"
        id="activity"
    >

        <div class="activity-title">
            Activité Discord
        </div>

        <div
            class="activity-name"
            id="activityName"
        ></div>

        <div
            class="activity-time"
            id="activityTime"
        ></div>

    </div>

    <div class="badges">

        <div class="badge">
            ✨ Profile
        </div>

        <div class="badge">
            🎮 Gamer
        </div>

        <div class="badge">
            💻 Developer
        </div>

    </div>

</div>

<!-- COMPTEUR -->

<div id="views">
    👁 0 vues
</div>

<script>

/* =========================
   DISCORD
========================= */

/*
   METS TON ID DISCORD ICI
*/

const DISCORD_ID =
    "1303798212540239923";

const couleurs = {
    online: "#00ff88",
    idle: "#ffaa00",
    dnd: "#ff4444",
    offline: "#777777"
};

const nomsStatut = {
    online: "EN LIGNE",
    idle: "ABSENT",
    dnd: "NE PAS DÉRANGER",
    offline: "HORS LIGNE"
};

let activityStart = null;

async function updateDiscord() {

    try {

        const response =
            await fetch(
                "https://api.lanyard.rest/v1/users/" +
                DISCORD_ID +
                "?t=" +
                Date.now()
            );

        if (!response.ok) {
            throw new Error(
                "Erreur Lanyard"
            );
        }

        const result =
            await response.json();

        if (!result.success) {
            throw new Error(
                "Profil Discord introuvable"
            );
        }

        const data =
            result.data;

        const status =
            data.discord_status ||
            "offline";

        const dot =
            document.getElementById(
                "statusDot"
            );

        const text =
            document.getElementById(
                "statusText"
            );

        dot.style.background =
            couleurs[status];

        dot.style.color =
            couleurs[status];

        text.textContent =
            nomsStatut[status];

        /* ACTIVITÉ */

        const activity =
            data.activities?.find(
                item => item.type === 0
            );

        const box =
            document.getElementById(
                "activity"
            );

        if (activity) {

            box.style.display =
                "block";

            document.getElementById(
                "activityName"
            ).textContent =
                activity.name;

            if (
                activity.timestamps &&
                activity.timestamps.start
            ) {

                activityStart =
                    activity.timestamps.start;

            } else {

                activityStart = null;
            }

        } else {

            box.style.display =
                "none";

            activityStart = null;
        }

    } catch (error) {

        console.log(error);

        document.getElementById(
            "statusText"
        ).textContent =
            "HORS LIGNE";

        document.getElementById(
            "statusDot"
        ).style.background =
            couleurs.offline;

        document.getElementById(
            "statusDot"
        ).style.color =
            couleurs.offline;
    }
}

updateDiscord();

setInterval(
    updateDiscord,
    10000
);


/* =========================
   TEMPS ACTIVITÉ
========================= */

function updateActivityTime() {

    if (!activityStart) {
        return;
    }

    const diff =
        Date.now() - activityStart;

    const minutes =
        Math.floor(
            diff / 60000
        );

    const hours =
        Math.floor(
            minutes / 60
        );

    if (hours > 0) {

        document.getElementById(
            "activityTime"
        ).textContent =
            "Depuis " +
            hours +
            "h " +
            (minutes % 60) +
            "min";

    } else {

        document.getElementById(
            "activityTime"
        ).textContent =
            "Depuis " +
            minutes +
            "min";
    }
}

setInterval(
    updateActivityTime,
    1000
);


/* =========================
   SON
========================= */

const video =
    document.getElementById(
        "background-video"
    );

const soundButton =
    document.getElementById(
        "soundButton"
    );

soundButton.addEventListener(
    "click",
    function() {

        video.muted =
            !video.muted;

        soundButton.textContent =
            video.muted
                ? "🔇"
                : "🔊";
    }
);


/* =========================
   PARTICULES
========================= */

const canvas =
    document.getElementById(
        "particles"
    );

const ctx =
    canvas.getContext("2d");

let particles = [];

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

for (
    let i = 0;
    i < 70;
    i++
) {

    particles.push({

        x:
            Math.random()
            * window.innerWidth,

        y:
            Math.random()
            * window.innerHeight,

        size:
            Math.random() * 2 + 0.5,

        speed:
            Math.random() * 0.5 + 0.1,

        opacity:
            Math.random() * 0.5 + 0.1
    });
}

function animateParticles() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(
        particle => {

            particle.y -=
                particle.speed;

            if (
                particle.y < 0
            ) {

                particle.y =
                    canvas.height;
            }

            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "rgba(255,255,255," +
                particle.opacity +
                ")";

            ctx.fill();
        }
    );

    requestAnimationFrame(
        animateParticles
    );
}

animateParticles();


/* =========================
   CURSEUR
========================= */

const sword =
    document.getElementById(
        "sword-cursor"
    );

document.addEventListener(
    "mousemove",
    function(event) {

        sword.style.left =
            event.clientX + "px";

        sword.style.top =
            event.clientY + "px";

        const trail =
            document.createElement(
                "div"
            );

        trail.className =
            "trail";

        trail.style.left =
            event.clientX + "px";

        trail.style.top =
            event.clientY + "px";

        document.body.appendChild(
            trail
        );

        setTimeout(
            function() {
                trail.remove();
            },
            500
        );
    }
);


/* =========================
   CLIC
========================= */

document.addEventListener(
    "click",
    function(event) {

        for (
            let i = 0;
            i < 10;
            i++
        ) {

            const particle =
                document.createElement(
                    "div"
                );

            particle.className =
                "click-particle";

            particle.style.left =
                event.clientX + "px";

            particle.style.top =
                event.clientY + "px";

            const angle =
                Math.random()
                * Math.PI
                * 2;

            const distance =
                Math.random()
                * 70 + 20;

            particle.style.setProperty(
                "--x",
                Math.cos(angle)
                * distance +
                "px"
            );

            particle.style.setProperty(
                "--y",
                Math.sin(angle)
                * distance +
                "px"
            );

            document.body.appendChild(
                particle
            );

            setTimeout(
                function() {
                    particle.remove();
                },
                600
            );
        }
    }
);


/* =========================
   COMPTEUR
========================= */

let vues =
    parseInt(
        localStorage.getItem(
            "brufor_profile_views"
        ),
        10
    );

if (Number.isNaN(vues)) {
    vues = 0;
}

vues++;

localStorage.setItem(
    "brufor_profile_views",
    vues
);

document.getElementById(
    "views"
).textContent =
    "👁 " +
    vues +
    " vues";

</script>

</body>
</html>
```
